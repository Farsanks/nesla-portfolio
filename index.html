<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050706" />

    <!-- Fallback metadata for crawlers that don't run JS.
         Per-page metadata is injected at runtime by React Helmet Async
         (see src/components/SEO.jsx). Replace the placeholder domain
         (example.com) with the real domain before launch. -->
    <title>Nesla Fathima — Digital Marketing Student | Emerald Editorial</title>
    <meta
      name="description"
      content="Nesla Fathima is a digital marketing student at Catalyst Academy, Calicut, exploring SEO, social media, content, and creative digital growth."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="canonical" href="https://example.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Nesla Fathima — Digital Marketing Student" />
    <meta
      property="og:description"
      content="Nesla Fathima is a digital marketing student at Catalyst Academy, Calicut, exploring SEO, social media, content, and creative digital growth."
    />
    <meta property="og:url" content="https://example.com/" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
